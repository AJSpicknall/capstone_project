{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}AJ's Games{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'main/css/style.css' %}" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="{% url 'home' %}">AJ's Games</a>
        <nav class="site-nav" aria-label="Primary">
          <a href="{% url 'home' %}">Home</a>
          <a href="{% url 'about' %}">About</a>
          <a href="{% url 'feedback' %}">Submit Feedback</a>
          <a href="{% url 'feedback_list' %}">Community Gallery</a>
        </nav>
      </div>
    </header>

    <main class="page-shell">
      {% if messages %}
        <ul class="messages" aria-live="polite">
          {% for message in messages %}
            <li class="message message-{{ message.tags|default:'info' }}">{{ message }}</li>
          {% endfor %}
        </ul>
      {% endif %}

      {% block content %}{% endblock %}
    </main>
  </body>
</html>
