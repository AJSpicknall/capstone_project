services:
  - type: web
    name: capstone-project
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py migrate && python manage.py seed_db data.csv --with-feedback && python manage.py collectstatic --noinput
    startCommand: gunicorn mysite.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "2"
      - key: SERVE_MEDIA
        value: "True"
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: capstone-db
          property: connectionString

databases:
  - name: capstone-db
    plan: free
